name: Package Marketplace VSIX

on:
  workflow_dispatch:
    inputs:
      channel:
        description: VSIX channel
        required: true
        default: pre-release
        type: choice
        options:
          - pre-release
          - stable

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  package:
    environment: vscode-marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: xvfb-run -a npm run test:extension
      - run: xvfb-run -a npm run test:reliability
      - name: Validate release channel
        run: node scripts/validate-release.cjs "${{ inputs.channel }}"
      - name: Package pre-release VSIX
        if: inputs.channel == 'pre-release'
        run: npm run package:pre-release -- --out gopdsdk-${{ github.run_id }}.vsix
      - name: Package stable VSIX
        if: inputs.channel == 'stable'
        run: npm run package -- --out gopdsdk-${{ github.run_id }}.vsix
      - name: Package previous-version fixture
        run: npx vsce package 0.0.1 --no-dependencies --no-update-package-json --out gopdsdk-previous.vsix
      - name: Verify install, upgrade, downgrade, and uninstall
        run: npm run test:install -- gopdsdk-previous.vsix gopdsdk-${{ github.run_id }}.vsix
      - name: Generate SPDX SBOM
        run: npm sbom --sbom-format spdx > sbom.spdx.json
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: gopdsdk-${{ github.run_id }}.vsix
      - uses: actions/attest@v4
        with:
          subject-path: gopdsdk-${{ github.run_id }}.vsix
          sbom-path: sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: gopdsdk-${{ inputs.channel }}-${{ github.run_id }}
          path: |
            gopdsdk-${{ github.run_id }}.vsix
            sbom.spdx.json
          if-no-files-found: error
