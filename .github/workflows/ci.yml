name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run compile

  unit-tests:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:compile
      - run: npm run test:unit

  integration-tests:
    name: Integration tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:compile
      - run: npm run test:integration

  extension-host:
    name: Extension Host tests (${{ matrix.os }}, VS Code ${{ matrix.vscode }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        vscode: ['1.95.3', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select VS Code version
        shell: bash
        run: echo "VSCODE_TEST_VERSION=${{ matrix.vscode }}" >> "$GITHUB_ENV"
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:extension
      - if: runner.os != 'Linux'
        run: npm run test:extension

  reliability:
    name: Reliability (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:reliability
      - if: runner.os != 'Linux'
        run: npm run test:reliability

  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs: [build, unit-tests, integration-tests, extension-host, reliability]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          EXTENSION_HOST_RESULT: ${{ needs.extension-host.result }}
          RELIABILITY_RESULT: ${{ needs.reliability.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$EXTENSION_HOST_RESULT" = success
          test "$RELIABILITY_RESULT" = success
